name: harness
on: [push, pull_request]
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: python .github/harness/scripts/harness_lint.py
      - run: python -m unittest discover -s .github/harness/tests -v
